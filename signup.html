<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Pawradise</title>
    <link rel="icon" type="img/png" href="pic/Pawradise.png">
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
     <div class="videobgdog">
        <video autoplay muted loop playsinline>
        <source src="video/dogcute.mp4" type="video/mp4">
        </video>
     </div>
     <div class="btn-backhome">
        <a href="main.html" class="back-ahef">
        <i class="fas fa-arrow-left"></i></a>
     </div>
     <div class="signup-box">
        <div class="logo-signin">
        <img class="logo-img" src="pic/PawradisenoBG.png" alt="logo"></div>
        <h2>Sign up to Pawradise</h2>
        <form action="">
            <button class="btnsignup-google">
            <img class="logogoogle" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
            Sign in with Google
            </button>
            <div class="horizonlinespan">
                <span>
                    or
                </span>
            </div>
            <div>
            <button class="btnlogmail">Continue with email</button></div>
            <div class="signup-toin">
                <p>Already have an account? <a href="signin.html">Sign In</a></p>
            </div>
        </form>
     </div>
</body>
</html>
