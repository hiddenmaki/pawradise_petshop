<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Pawradise</title>
    <link rel="icon" type="img/png" href="pic/Pawradise.png">
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>
<body>
    <div class="videobg">
        <video autoplay muted loop playsinline>
        <source src="video/blackcat.mp4" type="video/mp4"></video>
    </div>     
    <div class="signin-box">
        <a href="main.html" class="backhome">
        <i class="fas fa-arrow-left"></i>
</a>
        <div class="logologin">
            <img class="logoimg" src="pic/PawradisenoBG.png" alt="logo"></div>
        <h2>Sign in to Pawradise</h2>
        <form action="">
            <button class="btnlogingg">
            <img class="logogoogle" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
            Sign in with Google
            </button>
            <div class="horizonline">
                <span>
                    or sign in with email
                </span>
            </div>
            <label for="name">Username or Email</label>
            <div>
                <input type="text" name="Name" required>
            </div>
            <label for="password">Password</label>
            <div>
                <input type="text" name="Password" required>
            </div>
            <div class="btnsignin">
                <button  type="submit">Sign in</button>
            </div>
            <div class="ingoup">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>   
        </form>
    </div>
</body>
</html>
